conky.config = {
    alignment = 'bottom_right',
    xinerama_head = 1,
    background = true,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,
    gap_x = 30,
    gap_y = 250,
    minimum_width = 220,
    minimum_height = 340,
    maximum_width = 220,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_colour = '1a1a2e',
    border_inner_margin = 10,
    border_outer_margin = 0,
    draw_shades = true,
    default_shade_color = '000000',
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    override_utf8_locale = true,
    use_xft = true,
    font = 'Cantarell:size=10',
    xftalpha = 1,
    uppercase = false,
    default_color = 'D6D5D4',
    out_to_x = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    update_interval = 2.0,
    own_window_class = 'conky-pokemon',
    lua_load = '~/.config/conky/pokemon_click.lua',
    lua_mouse_hook = 'mouse_hook',
}

conky.text = [[
${execpi 600 ~/.config/conky/pokemon_refresh.sh}${image ~/.config/conky/pokemon/sprite.png -p 30,0 -s 160x160}${voffset 165}${font Cantarell:bold:size=9}${color ffcb05}POKEMON${color}${font}${alignr}${color ffcb05}${execpi 600 sed -n '1p' ~/.config/conky/pokemon/info.txt}${color}
${font Cantarell:bold:size=16}${color ffffff}${execpi 0 sed -n '2p' ~/.config/conky/pokemon/info.txt}${color}${font}
${font Cantarell:size=10}${color 3b82f6}${execpi 0 sed -n '3p' ~/.config/conky/pokemon/info.txt}${color}${font}
${voffset 5}${font Cantarell:size=9}${color ffcb05}HP${color}${alignr}${execpi 0 sed -n '4p' ~/.config/conky/pokemon/info.txt}
${color ffcb05}ATK${color}${alignr}${execpi 0 sed -n '5p' ~/.config/conky/pokemon/info.txt}
${color ffcb05}DEF${color}${alignr}${execpi 0 sed -n '6p' ~/.config/conky/pokemon/info.txt}
${color ffcb05}SP.ATK${color}${alignr}${execpi 0 sed -n '7p' ~/.config/conky/pokemon/info.txt}
${color ffcb05}SP.DEF${color}${alignr}${execpi 0 sed -n '8p' ~/.config/conky/pokemon/info.txt}
${color ffcb05}SPD${color}${alignr}${execpi 0 sed -n '9p' ~/.config/conky/pokemon/info.txt}
${voffset 3}${color 888888}${execpi 0 sed -n '10p' ~/.config/conky/pokemon/info.txt}  |  ${execpi 0 sed -n '11p' ~/.config/conky/pokemon/info.txt}${color}${font}
]]
